# Scheduled corpus refresh.
#
# Committing regenerated artifacts back to the repo is what triggers a
# Streamlit Cloud redeploy — the schedule, the pipeline and the
# deployment are one chain rather than three separate mechanisms.
name: Update corpus

on:
  # Weekly refresh. Safe on a clean checkout since the corpus is defined
  # by data/corpus_manifest.json rather than by "the N most recent
  # filings" — the runner reconstructs exactly the same set.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m pipeline.run_pipeline

      - name: Commit updated artifacts
        run: |
          git config user.name "corpus-bot"
          git config user.email "actions@github.com"
          # Embeddings differ in their last bits across architectures, so
          # committing them unconditionally produces a commit on every
          # run even when nothing changed. Gate on chunks.json, which is
          # deterministic given the same inputs.
          git add data/processed/chunks.json data/processed/pipeline_manifest.json
          if ! git diff --staged --quiet; then
            git add data/processed/embeddings.npy
            git commit -m "chore: refresh corpus from EDGAR"
            git push
          fi